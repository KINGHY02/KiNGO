name: Build and release KiNGO

on:
  pull_request:
    paths:
      - "README.md"
      - "kingo-next/**"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kingo-next/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: kingo-next
        run: npm ci

      - name: Check Rust formatting
        working-directory: kingo-next
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust lints
        working-directory: kingo-next
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A linker_messages

      - name: Test Rust backend
        working-directory: kingo-next
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build pull request installer
        if: github.event_name == 'pull_request'
        working-directory: kingo-next
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.pr.conf.json

      - name: Build and publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: kingo-next
          tagName: ${{ github.ref_name }}
          releaseName: "KiNGO ${{ github.ref_name }}"
          releaseBody: |
            KiNGO 2.0 新架构 Windows x64 安装包。
            已安装支持软件内更新的 KiNGO 版本可直接在“设置 → 软件更新”完成下载、验证、安装和自动重启。
            首次安装仍可下载 `KiNGO-Setup-*-x64.exe`。本版本未使用 Windows 代码签名证书，首次运行时仍可能显示 SmartScreen 提示。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
          releaseAssetNamePattern: "KiNGO-Setup-[version]-[arch][ext]"
