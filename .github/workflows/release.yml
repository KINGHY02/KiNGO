name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download proxy resources
        run: gh release download resources --pattern "resources.zip" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract resources
        run: powershell Expand-Archive -Path resources.zip -DestinationPath . -Force

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build & Package Installer
        run: cd app && npm run dist

      - name: Create Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/dist/*.exe
            app/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
