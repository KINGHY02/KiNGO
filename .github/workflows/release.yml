name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download proxy resources
        run: gh release download resources --pattern "resources.zip" --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract resources
        run: powershell Expand-Archive -Path resources.zip -DestinationPath . -Force

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build & Publish
        run: cd app && npm run dist
